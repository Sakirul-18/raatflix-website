name: Weekly Series JSON Update

on:
  schedule:
    # 21:00 UTC on Thursday = 03:00 AM Bangladesh Time on Friday
    - cron: '0 21 * * 4'
  
  # Allows manual runs anytime from the Actions tab
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Python/requirements.txt ]; then pip install -r Python/requirements.txt; fi

      # Step 1: Run the main crawler
      - name: Run Crawler
        run: |
          python Python/crawler.py

      # Step 2: Run the script to patch/fix missing series
      - name: Fix Missing Series
        run: |
          python Python/fix_missing_series.py

      # Step 3: Commit and push the resulting JSON back to repository
      - name: Commit and push updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update series.json via github action"
          file_pattern: "data/series.json series.json"
