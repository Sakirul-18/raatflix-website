name: Weekly Series JSON Update

on:
  schedule:
    # 21:00 UTC on Thursday = 03:00 AM Bangladesh Time on Friday
    - cron: '0 21 * * 4'
  
  # Allows manual runs anytime from the Actions tab
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # MAKE SURE THIS MATCHES YOUR PYTHON SCRIPT NAME & PATH
      - name: Run Python Scraper
        run: |
          python your_script_name.py

      - name: Commit and push updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update series.json via github action"
          file_pattern: "data/series.json series.json"
        name: Weekly Series JSON Update

