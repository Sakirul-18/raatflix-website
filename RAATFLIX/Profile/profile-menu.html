<!-- Profile Dropdown Component -->
<div class="profile-dropdown-container">
    <div class="profile-avatar-btn" id="profileTrigger">
        <img src="../main/images/profiles/default.png" alt="Profile" class="profile-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=0D1B2A&color=fff'">
    </div>

    <!-- Animated Dropdown Card -->
    <div class="profile-dropdown-menu" id="profileMenu">
        <div class="dropdown-header">
            <img src="../main/images/profiles/default.png" alt="User Avatar" class="dropdown-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=0D1B2A&color=fff'">
            <h4 class="dropdown-username">Sakirul</h4>
        </div>
        
        <div class="dropdown-divider"></div>
        
        <ul class="dropdown-links">
            <li>
                <a href="../main/account.html">
                    <span class="material-symbols-rounded">manage_accounts</span>
                    Account
                </a>
            </li>
            <li>
                <a href="../Support/help_center.html">
                    <span class="material-symbols-rounded">help</span>
                    Help Center
                </a>
            </li>
        </ul>

        <div class="dropdown-divider"></div>

        <div class="dropdown-footer">
            <button id="signOutBtn" class="sign-out-btn">
                <span class="material-symbols-rounded">logout</span>
                Sign Out of RaatFlix
            </button>
        </div>
    </div>
</div>
